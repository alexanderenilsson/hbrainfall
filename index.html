<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nederbörd – Hamrabacken</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f0f4f0;
    --surface: #ffffff;
    --border: #d4ddd4;
    --text: #1a2a1a;
    --muted: #6a7f6a;
    --accent: #2d5a2d;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    padding: 2rem 1.5rem 3rem;
  }

  header {
    max-width: 900px;
    margin: 0 auto 2rem;
    display: flex;
    align-items: baseline;
    gap: 1rem;
    border-bottom: 1.5px solid var(--accent);
    padding-bottom: 0.75rem;
    flex-wrap: wrap;
  }

  h1 {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .subtitle {
    font-size: 0.8rem;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
  }

  .updated {
    font-size: 0.7rem;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    margin-left: auto;
    opacity: 0.7;
  }

  .card {
    max-width: 900px;
    margin: 0 auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 1.5rem;
  }

  /* ── View tabs ── */
  .view-tabs {
    display: flex;
    gap: 0;
    margin-bottom: 1.5rem;
    border: 1px solid var(--border);
    border-radius: 2px;
    overflow: hidden;
    width: fit-content;
  }

  .tab-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 0.4rem 1rem;
    border: none;
    border-right: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: background 0.1s, color 0.1s;
  }

  .tab-btn:last-child { border-right: none; }
  .tab-btn.active { background: var(--accent); color: #fff; }
  .tab-btn:hover:not(.active) { background: var(--bg); }

  /* ── Year controls (line + bar only) ── */
  .year-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin-bottom: 1.5rem;
    align-items: center;
  }

  .year-controls label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-right: 0.4rem;
    text-transform: uppercase;
  }

  .btn-year {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    font-weight: 600;
    padding: 0.3rem 0.7rem;
    border: 1.5px solid var(--border);
    border-radius: 2px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.12s;
  }

  .btn-year::before {
    content: '';
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    margin-right: 5px;
    background: currentColor;
    opacity: 0.4;
    vertical-align: middle;
  }

  .btn-year.active { border-color: currentColor; color: inherit; }
  .btn-year.active::before { opacity: 1; }
  .btn-year:hover { opacity: 0.75; }

  .controls-meta { display: flex; gap: 0.5rem; margin-left: auto; }

  .btn-meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    padding: 0.25rem 0.6rem;
    border: 1px solid var(--border);
    border-radius: 2px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .btn-meta:hover { background: var(--bg); }

  /* ── Chart areas ── */
  .chart-wrap { position: relative; height: 400px; }

  /* ── Heatmap ── */
  #heatmapWrap {
    overflow-x: auto;
  }

  .heatmap-table {
    width: 100%;
    border-collapse: collapse;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
  }

  .heatmap-table th {
    padding: 0.4rem 0.6rem;
    color: var(--muted);
    font-weight: 600;
    text-align: center;
    white-space: nowrap;
    border-bottom: 1px solid var(--border);
  }

  .heatmap-table th.row-header { text-align: left; }

  .heatmap-table td {
    padding: 0.55rem 0.4rem;
    text-align: center;
    font-weight: 600;
    font-size: 0.78rem;
    min-width: 52px;
    transition: opacity 0.1s;
    cursor: default;
    position: relative;
  }

  .heatmap-table td.year-label {
    text-align: left;
    color: var(--muted);
    font-weight: 400;
    background: transparent !important;
    padding-right: 1rem;
    min-width: 48px;
  }

  .heatmap-table td.total-cell {
    border-left: 1px solid var(--border);
    color: var(--text);
    background: transparent !important;
    font-size: 0.72rem;
  }

  .heatmap-table tr:hover td:not(.year-label):not(.total-cell) {
    outline: 1.5px solid var(--accent);
    outline-offset: -1px;
  }

  /* ── Heatmap legend ── */
  .heatmap-legend {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 1rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    color: var(--muted);
  }

  .legend-bar {
    height: 10px;
    width: 160px;
    border-radius: 2px;
    background: linear-gradient(to right, #eaf3ea, #0a3d0a);
  }

  /* ── Totals row ── */
  .totals {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-top: 1.5rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
  }

  .total-chip {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    padding: 0.25rem 0.6rem;
    border-radius: 2px;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    border: 1px solid var(--border);
  }

  .total-chip .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .total-chip .val { font-weight: 600; }
  .total-chip .yr  { color: var(--muted); }

  .last-entry {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    margin-bottom: 1.2rem;
    padding: 0.4rem 0.7rem;
    border-left: 2px solid var(--accent);
    background: var(--bg);
  }

  .last-entry strong {
    color: var(--text);
    font-weight: 600;
  }

  #status {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    color: var(--muted);
    padding: 2rem;
    text-align: center;
  }

  .view-panel { display: none; }
  .view-panel.active { display: block; }
</style>
</head>
<body>

<header>
  <h1>Hamrabacken</h1>
  <span class="subtitle">Nederbörd &nbsp;·&nbsp; mm/månad</span>
  <span class="updated" id="updatedLabel"></span>
</header>

<div class="card">
  <div id="status">Hämtar data…</div>
  <div id="lastEntry" style="display:none" class="last-entry"></div>
  <div id="app" style="display:none">

    <!-- View tabs -->
    <div class="view-tabs">
      <button class="tab-btn active" data-view="heatmap">Heatmap</button>
      <button class="tab-btn" data-view="bar">Stapel</button>
      <button class="tab-btn" data-view="line">Linje</button>
    </div>

    <!-- LINE VIEW -->
    <div class="view-panel" id="panel-line">
      <div class="year-controls" id="yearControlsLine">
        <label>År</label>
        <div class="controls-meta">
          <button class="btn-meta" id="btnAllLine">Alla</button>
          <button class="btn-meta" id="btnNoneLine">Inga</button>
        </div>
      </div>
      <div class="chart-wrap"><canvas id="lineChart"></canvas></div>
      <div class="totals" id="totalsLine"></div>
    </div>

    <!-- BAR VIEW -->
    <div class="view-panel" id="panel-bar">
      <div class="year-controls" id="yearControlsBar">
        <label>År</label>
        <div class="controls-meta">
          <button class="btn-meta" id="btnAllBar">Alla</button>
          <button class="btn-meta" id="btnNoneBar">Inga</button>
        </div>
      </div>
      <div class="chart-wrap"><canvas id="barChart"></canvas></div>
      <div class="totals" id="totalsBar"></div>
    </div>

    <!-- HEATMAP VIEW -->
    <div class="view-panel active" id="panel-heatmap">
      <div id="heatmapWrap"></div>
      <div class="heatmap-legend">
        <span>0 mm</span>
        <div class="legend-bar"></div>
        <span id="legendMax"></span>
      </div>
    </div>

  </div>
</div>

<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT6eDcquk_GjPFBNt54aXVQPfHMYclEDoNeHET4YPqRIIBcwOUtWx6KLA-e-w5nPNZftTgONoObl40A/pub?gid=1007788289&single=true&output=csv';

const MONTH_LABELS = { 4:'Apr', 5:'Maj', 6:'Jun', 7:'Jul', 8:'Aug', 9:'Sep', 10:'Okt', 11:'Nov' };

const PALETTE = [
  '#5b8a3c','#2e7d9b','#b5701a','#7a3b8a','#b5272e',
  '#3b7a6e','#8a7a2e','#1a4e8a','#8a4b1a','#4a8a5b',
];

// ── CSV parser — reads raw log sheet, aggregates by year+month ──────────
function parseCSV(text) {
  const lines = text.trim().split('\n');
  // Detect separator
  const sep = lines[0].includes('\t') ? '\t' : ',';
  const rows = lines.map(l => l.split(sep).map(c => c.trim().replace(/^"|"$/g, '')));

  // Helper: convert Excel serial date to {year, month}
  function serialToYearMonth(val) {
    const serial = parseFloat(String(val).replace(',', '.'));
    if (isNaN(serial)) return null;
    // Excel epoch: 1899-12-30
    const d = new Date(Date.UTC(1899, 11, 30) + Math.round(serial) * 86400000);
    return { yr: d.getUTCFullYear(), mo: d.getUTCMonth() + 1 };
  }

  // Helper: parse ISO date string to {year, month}
  function isoToYearMonth(ts) {
    const m = ts.match(/^(\d{4})-(\d{2})/);
    return m ? { yr: parseInt(m[1]), mo: parseInt(m[2]) } : null;
  }

  // Skip header rows
  const dataRows = rows.filter(r => r[1] !== '' && r[1] !== undefined && !isNaN(parseFloat((r[1]||'').replace(',','.'))));

  // col 1 = mm, col 3 = fastställd tid (serial number or ISO date)
  const agg = {}; // agg[year][month] = total mm

  for (const row of dataRows) {
    const mm = parseFloat((row[1] || '').replace(',', '.'));
    if (isNaN(mm) || mm <= 0) continue;

    const tsRaw = row[3] || row[0] || '';
    let ym = null;
    if (/^\d{4}-\d{2}/.test(tsRaw)) {
      ym = isoToYearMonth(tsRaw);
    } else {
      ym = serialToYearMonth(tsRaw);
    }
    if (!ym) continue;

    const { yr, mo } = ym;
    if (!agg[yr]) agg[yr] = {};
    agg[yr][mo] = (agg[yr][mo] || 0) + mm;
  }

  const years  = Object.keys(agg).map(Number).sort((a, b) => a - b);
  const monthSet = new Set();
  years.forEach(yr => Object.keys(agg[yr]).forEach(m => monthSet.add(Number(m))));
  const months = Array.from(monthSet).sort((a, b) => a - b);

  // Convert to data[year][month]
  const data = {};
  years.forEach(yr => {
    data[yr] = {};
    months.forEach(mo => { data[yr][mo] = agg[yr][mo] || null; });
  });

  // Find last logged entry (last valid data row)
  let lastDate = null, lastMm = null;
  for (let i = dataRows.length - 1; i >= 0; i--) {
    const row = dataRows[i];
    const mm = parseFloat((row[1] || '').replace(',', '.'));
    if (isNaN(mm)) continue;
    const tsRaw = row[3] || row[0] || '';
    let dateStr = null;
    if (/^\d{4}-\d{2}/.test(tsRaw)) {
      dateStr = tsRaw.replace(/\./, ':').replace(/\./, ':').substring(0, 16);
    } else {
      const serial = parseFloat(String(tsRaw).replace(',', '.'));
      if (!isNaN(serial)) {
        const d = new Date(Date.UTC(1899, 11, 30) + Math.round(serial) * 86400000);
        dateStr = d.toISOString().substring(0, 10);
      }
    }
    if (dateStr) { lastDate = dateStr; lastMm = mm; break; }
  }

  return { years, months, data, lastDate, lastMm };
}

// ── Heatmap colour interpolation (white → deep green) ─────────────────
function heatColor(val, max) {
  if (val === null || val === undefined) return '#f0f4f0';
  const t = Math.min(val / max, 1);
  // light green → deep forest green
  const r = Math.round(234 - t * (234 - 10));
  const g = Math.round(243 - t * (243 - 61));
  const b = Math.round(234 - t * (234 - 10));
  return `rgb(${r},${g},${b})`;
}

function textColor(val, max) {
  if (val === null) return '#aaa';
  return (val / max) > 0.55 ? '#fff' : '#1a2a1a';
}

// ── Chart tooltip style ────────────────────────────────────────────────
const tooltipDefaults = {
  backgroundColor: '#1a2a1aee',
  titleFont: { family: "'IBM Plex Mono', monospace", size: 11 },
  bodyFont:  { family: "'IBM Plex Mono', monospace", size: 11 },
  padding: 10,
};

const tickStyle = { font: { family: "'IBM Plex Mono', monospace", size: 11 }, color: '#6a7f6a' };
const gridColor = '#d4ddd440';

// ── Main ───────────────────────────────────────────────────────────────
async function init() {
  let parsed;
  try {
    const res = await fetch(CSV_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    parsed = parseCSV(await res.text());
  } catch(e) {
    document.getElementById('status').textContent = 'Kunde inte hämta data. Kontrollera att sheetet är publicerat.';
    return;
  }

  document.getElementById('status').style.display = 'none';
  document.getElementById('app').style.display = 'block';

  if (parsed.lastDate !== null) {
    const el = document.getElementById('lastEntry');
    const mmStr = parsed.lastMm === 0 ? '0 mm' : parsed.lastMm + ' mm';
    el.innerHTML = `Senaste loggade: <strong>${parsed.lastDate}</strong> &nbsp;·&nbsp; <strong>${mmStr}</strong>`;
    el.style.display = 'block';
  }
  document.getElementById('updatedLabel').textContent =
    'Uppdaterad ' + new Date().toLocaleDateString('sv-SE');

  const { years, months, data } = parsed;
  const monthLabels = months.map(m => MONTH_LABELS[m] || m);

  // ── Shared active-year state per view ─────────────────────────────
  const activeLine = new Set(years);
  const activeBar  = new Set(years);

  // ════════════════════════════════════════════════════════════════════
  // LINE CHART
  // ════════════════════════════════════════════════════════════════════
  const lineCtx = document.getElementById('lineChart').getContext('2d');
  const lineChart = new Chart(lineCtx, {
    type: 'line',
    data: {
      labels: monthLabels,
      datasets: years.map((yr, i) => ({
        label: String(yr),
        data: months.map(m => data[yr][m] ?? null),
        borderColor: PALETTE[i % PALETTE.length],
        backgroundColor: PALETTE[i % PALETTE.length] + '18',
        pointBackgroundColor: PALETTE[i % PALETTE.length],
        pointRadius: 4, pointHoverRadius: 6,
        borderWidth: 2, tension: 0.35, spanGaps: false,
      }))
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: { ...tooltipDefaults, callbacks: {
          label: c => ` ${c.dataset.label}: ${c.parsed.y != null ? c.parsed.y + ' mm' : '–'}`
        }}
      },
      scales: {
        x: { grid: { color: gridColor }, ticks: tickStyle, border: { color: '#d4ddd4' } },
        y: { beginAtZero: true, grid: { color: gridColor }, ticks: { ...tickStyle, callback: v => v + ' mm' }, border: { color: '#d4ddd4' } }
      }
    }
  });

  buildYearControls('yearControlsLine', years, activeLine, 'btnAllLine', 'btnNoneLine',
    () => {
      lineChart.data.datasets.forEach(ds => { ds.hidden = !activeLine.has(Number(ds.label)); });
      lineChart.update();
      renderTotals('totalsLine', years, months, data, activeLine);
    }
  );
  renderTotals('totalsLine', years, months, data, activeLine);

  // ════════════════════════════════════════════════════════════════════
  // BAR CHART — grouped by month, one bar per year
  // ════════════════════════════════════════════════════════════════════
  const barCtx = document.getElementById('barChart').getContext('2d');
  const barChart = new Chart(barCtx, {
    type: 'bar',
    data: {
      labels: monthLabels,
      datasets: years.map((yr, i) => ({
        label: String(yr),
        data: months.map(m => data[yr][m] ?? 0),
        backgroundColor: PALETTE[i % PALETTE.length] + 'cc',
        borderColor: PALETTE[i % PALETTE.length],
        borderWidth: 1,
        borderRadius: 2,
      }))
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: { ...tooltipDefaults, callbacks: {
          label: c => ` ${c.dataset.label}: ${c.parsed.y} mm`
        }}
      },
      scales: {
        x: { grid: { color: gridColor }, ticks: tickStyle, border: { color: '#d4ddd4' } },
        y: { beginAtZero: true, grid: { color: gridColor }, ticks: { ...tickStyle, callback: v => v + ' mm' }, border: { color: '#d4ddd4' } }
      }
    }
  });

  buildYearControls('yearControlsBar', years, activeBar, 'btnAllBar', 'btnNoneBar',
    () => {
      barChart.data.datasets.forEach(ds => { ds.hidden = !activeBar.has(Number(ds.label)); });
      barChart.update();
      renderTotals('totalsBar', years, months, data, activeBar);
    }
  );
  renderTotals('totalsBar', years, months, data, activeBar);

  // ════════════════════════════════════════════════════════════════════
  // HEATMAP
  // ════════════════════════════════════════════════════════════════════
  const allVals = years.flatMap(yr => months.map(m => data[yr][m] ?? 0));
  const maxVal  = Math.max(...allVals);
  document.getElementById('legendMax').textContent = Math.round(maxVal) + ' mm';

  const wrap = document.getElementById('heatmapWrap');
  const table = document.createElement('table');
  table.className = 'heatmap-table';

  // Header row
  const thead = table.createTHead();
  const hrow  = thead.insertRow();
  const thYear = document.createElement('th');
  thYear.className = 'row-header';
  thYear.textContent = 'År';
  hrow.appendChild(thYear);
  months.forEach(m => {
    const th = document.createElement('th');
    th.textContent = MONTH_LABELS[m] || m;
    hrow.appendChild(th);
  });
  const thTotal = document.createElement('th');
  thTotal.textContent = 'Totalt';
  hrow.appendChild(thTotal);

  // Data rows
  const tbody = table.createTBody();
  years.forEach(yr => {
    const tr = tbody.insertRow();
    // Year label
    const tdYr = tr.insertCell();
    tdYr.className = 'year-label';
    tdYr.textContent = yr;
    // Month cells
    months.forEach(m => {
      const v = data[yr][m];
      const td = tr.insertCell();
      td.style.background = heatColor(v, maxVal);
      td.style.color = textColor(v, maxVal);
      td.textContent = v != null ? Math.round(v) : '–';
      td.title = `${yr} ${MONTH_LABELS[m] || m}: ${v != null ? v + ' mm' : 'saknas'}`;
    });
    // Total
    const total = months.reduce((s, m) => s + (data[yr][m] || 0), 0);
    const tdTot = tr.insertCell();
    tdTot.className = 'total-cell';
    tdTot.textContent = Math.round(total) + ' mm';
  });

  wrap.appendChild(table);

  // ── Tab switching ─────────────────────────────────────────────────
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.view).classList.add('active');
      // Trigger resize for charts after display change
      if (btn.dataset.view === 'line') lineChart.resize();
      if (btn.dataset.view === 'bar')  barChart.resize();
    });
  });
}

// ── Year control builder ───────────────────────────────────────────────
function buildYearControls(containerId, years, activeSet, allId, noneId, onChange) {
  const container = document.getElementById(containerId);
  const metaDiv   = container.querySelector('.controls-meta');
  const btns = {};

  years.forEach((yr, i) => {
    const color = PALETTE[i % PALETTE.length];
    const btn = document.createElement('button');
    btn.className = 'btn-year active';
    btn.textContent = yr;
    btn.style.color = color;
    btn.addEventListener('click', () => {
      if (activeSet.has(yr)) { activeSet.delete(yr); btn.classList.remove('active'); }
      else                   { activeSet.add(yr);    btn.classList.add('active');    }
      onChange();
    });
    container.insertBefore(btn, metaDiv);
    btns[yr] = btn;
  });

  document.getElementById(allId).addEventListener('click', () => {
    years.forEach(yr => { activeSet.add(yr); btns[yr].classList.add('active'); });
    onChange();
  });
  document.getElementById(noneId).addEventListener('click', () => {
    years.forEach(yr => { activeSet.delete(yr); btns[yr].classList.remove('active'); });
    onChange();
  });
}

// ── Totals footer ──────────────────────────────────────────────────────
function renderTotals(elId, years, months, data, activeSet) {
  const el = document.getElementById(elId);
  el.innerHTML = '';
  years.forEach((yr, i) => {
    if (!activeSet.has(yr)) return;
    const total = months.reduce((s, m) => s + (data[yr][m] || 0), 0);
    const color = PALETTE[i % PALETTE.length];
    const chip = document.createElement('div');
    chip.className = 'total-chip';
    chip.innerHTML = `<span class="dot" style="background:${color}"></span><span class="yr">${yr}</span><span class="val">${Math.round(total)} mm</span>`;
    el.appendChild(chip);
  });
}

init();
</script>
</body>
</html>
